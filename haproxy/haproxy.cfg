global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    retries 3
    timeout connect 5s
    timeout client  50s
    timeout server  50s

frontend react_frontend
    bind *:80
    mode http
    default_backend react_servers

frontend stats_frontend
    bind *:8404
    mode http
    stats enable
    stats uri /haproxy-stats
    stats refresh 5s
    stats auth admin:SecurePassword123!
    acl management_net src 192.168.56.0/24
    http-request deny if !management_net

backend react_servers
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server web01 192.168.56.20:3000 check inter 3s rise 2 fall 3
    server web02 192.168.56.21:3000 check inter 3s rise 2 fall 3